<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}HermesOrch{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .htmx-indicator { opacity: 0; transition: opacity .2s; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <div class="text-xs uppercase tracking-widest text-slate-400">HermesOrch</div>
        <h1 class="text-xl font-semibold">{% block heading %}Dashboard{% endblock %}</h1>
      </div>
      <div class="text-sm text-slate-500">
        <span class="inline-flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          connected &middot; gemma4:31b
        </span>
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-6 py-6">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
